<?xml version="1.0" encoding="UTF-8"?>
<!-- Surface: the dark app menu and the side_menu panel, where Nextcloud paints
     the glyph over dark chrome. Single tint by contract (AppIconTest). Pair:
     app-dark.svg for light surfaces. No double hyphens live in XML comments:
     a comment containing one is a parse error and the file renders as nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<!-- Three bars: a figure beside the figures it is compared with. -->
	<g fill="#fff">
		<rect x="5" y="16" width="6" height="11" rx="1"/>
		<rect x="13" y="6" width="6" height="21" rx="1"/>
		<rect x="21" y="11" width="6" height="16" rx="1"/>
	</g>
</svg>
